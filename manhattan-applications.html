>\n      <div class=\"line\" id=\"liveA\">&nbsp;<\/div>\n      <div class=\"hr\"><\/div>\n      <div class=\"line\" id=\"eqA0\"><span class=\"m\">|x<\/span> \u2212 3<span class=\"m\">|<\/span> = 2<\/div>\n      <div class=\"line\" id=\"eqA1\">\u21d4 <span class=\"m\">x<\/span> \u2212 3 = 2 ou <span class=\"m\">x<\/span> \u2212 3 = \u22122<\/div>\n      <div class=\"line\" id=\"eqA2\">\u21d4 <span class=\"m cOk\">x<\/span> = <b class=\"cOk\">5<\/b> ou <span class=\"m cOk\">x<\/span> = <b class=\"cOk\">1<\/b><\/div>\n      <div class=\"line\" id=\"eqA3\" style=\"margin-top:.3em\"><span class=\"m\">|x<\/span> \u2212 3<span class=\"m\">|<\/span> \u2264 2 \u21d4 <b class=\"cOk\">1 \u2264 <span class=\"m\">x<\/span> \u2264 5<\/b><\/div>\n    <\/div>\n    <div class=\"sec\" id=\"secB\" style=\"display:none\">\n      <h3>Distance de Manhattan<\/h3>\n      <div class=\"line big\">d = <span class=\"m\">|x<\/span> \u2212 <span class=\"m\">a|<\/span> + <span class=\"m\">|y<\/span> \u2212 <span class=\"m\">b|<\/span><\/div>\n      <div class=\"line mu\" style=\"font-size:.9em\">entre (<span class=\"m\">x<\/span> ; <span class=\"m\">y<\/span>) et (<span class=\"m\">a<\/span> ; <span class=\"m\">b<\/span>)<\/div>\n      <div class=\"hr\"><\/div>\n      <div class=\"line\" id=\"eqB0\"><span class=\"cB\">Bip<\/span>(1 ; 1) et <span class=\"cZ\">Zap<\/span>(4 ; 3)<\/div>\n      <div class=\"line\" id=\"eqB1\">d = <span class=\"cx\">|1 \u2212 4|<\/span> + <span class=\"cy\">|1 \u2212 3|<\/span> = <span class=\"cx\">3<\/span> + <span class=\"cy\">2<\/span> = <b>5<\/b><\/div>\n      <div class=\"line\" id=\"eqB2\" style=\"margin-top:.3em\">\u00e0 3 pas de <span class=\"cZ\">Zap<\/span>&nbsp;: <span class=\"m\">|x<\/span> \u2212 4<span class=\"m\">|<\/span> + <span class=\"m\">|y<\/span> \u2212 3<span class=\"m\">|<\/span> = 3<\/div>\n      <div class=\"line\" id=\"eqB3\">\u2192 <b class=\"cOk\">un losange<\/b>, pas un cercle&nbsp;!<\/div>\n    <\/div>\n    <div class=\"sec\" id=\"secC\" style=\"display:none\">\n      <h3>Qui arrive le premier&nbsp;?<\/h3>\n      <div class=\"line\"><span class=\"cB\">Bip<\/span>(1 ; 1) \u00b7 <span class=\"cZ\">Zap<\/span>(4 ; 4) \u00b7 <span class=\"cI\">Zip<\/span>(1 ; 6)<\/div>\n      <table class=\"cmp\">\n        <tr><th><\/th><th>\u00e0 vol d\u2019oiseau<\/th><th>dans la grille<\/th><\/tr>\n        <tr id=\"rowZ\"><td class=\"cZ\"><b>Zap<\/b><\/td><td id=\"eZ\">\u221a(3\u00b2 + 3\u00b2) \u2248 4,24<\/td><td id=\"mZ\">|1 \u2212 4| + |1 \u2212 4| = <b>6<\/b><\/td><\/tr>\n        <tr id=\"rowI\"><td class=\"cI\"><b>Zip<\/b><\/td><td id=\"eI\">\u221a(0\u00b2 + 5\u00b2) = 5<\/td><td id=\"mI\">|1 \u2212 1| + |1 \u2212 6| = <b>5<\/b><\/td><\/tr>\n      <\/table>\n      <div class=\"line\" id=\"verdC\" style=\"margin-top:.3em\">&nbsp;<\/div>\n    <\/div>\n  <\/div>\n  <div class=\"caption\" id=\"caption\" style=\"opacity:0\"><i class=\"bar\"><\/i><span id=\"captxt\"><\/span><\/div>\n  <div class=\"ctrl\"><button id=\"voice\" aria-pressed=\"false\">Activer la voix<\/button><button id=\"sound\" aria-pressed=\"false\">Activer le son<\/button><button id=\"pause\">Pause<\/button><button id=\"replay\">Rejouer<\/button><\/div>\n  <div class=\"seek\"><input type=\"range\" id=\"seek\" min=\"0\" max=\"54\" step=\"0.1\" value=\"0\" aria-label=\"Position dans l'animation\"><span id=\"clock\">0:00 / 0:54<\/span><\/div>\n<\/div>\n<script>\n(function(){\n  const REC = /[?&]record/.test(location.search); if (REC) document.body.classList.add('rec');\n  const $ = id => document.getElementById(id);\n  const clamp = x => Math.max(0, Math.min(1, x));\n  const ease = x => x<.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2;\n  const sine = x => -(Math.cos(Math.PI*x)-1)/2;\n  const lerp = (a,b,k) => a + (b-a)*k;\n  const back = x => { const c=1.7, c3=c+1; return 1 + c3*Math.pow(x-1,3) + c*Math.pow(x-1,2); };\n  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();\n  const fr = n => String(Math.round(n*100)/100).replace('.', ',').replace('-', '\u2212');\n\n  // ---------- chronologie ----------\n  const K = { line:1e9, bip:1e9, star:1e9, formula:1e9, m1:[1e9, 1e9], m2:[1e9, 1e9], q:1e9, sol:[1e9, 1e9], ineq:1e9,\n              toGrid:[2.4, 4.4], wallsCap:4.9, zap:10.9, path1:[13.9, 18.9], calc:19.4, path2:[23.4, 28.4], ringQ:30.4, ring:[33.4, 38.9], losange:40.4, circle:42.4,\n              duel:4.0e9, euclid:4.0e9, manh:4.0e9, race:[1e9, 1e9], verdict:4.0e9, final:45.5 };\n  const END = 54, SLOW = 1;\n  const caps = [\n    [0.3, ''],\n    [K.line, 'Bip le robot se d\u00e9place le long d\u2019un couloir gradu\u00e9.'],\n    [K.star, 'Une \u00e9toile bonus est au point 3.'],\n    [K.formula, 'La distance entre <span class=\"m\">x<\/span> et 3, c\u2019est <span class=\"m\">|x<\/span> \u2212 3<span class=\"m\">|<\/span>\\u00a0: la valeur absolue enl\u00e8ve le signe.'],\n    [K.m1[0], 'En 6\\u00a0: |6 \u2212 3| = 3 cases.'],\n    [K.m2[0], 'En 1\\u00a0: |1 \u2212 3| = |\u22122| = 2 cases. La distance n\u2019est jamais n\u00e9gative.'],\n    [K.q, 'O\u00f9 se placer pour \u00eatre exactement \u00e0 2 cases de l\u2019\u00e9toile\\u00a0? <span class=\"m\">|x<\/span> \u2212 3<span class=\"m\">|<\/span> = 2.'],\n    [K.sol[0], 'Soit <span class=\"m\">x<\/span> \u2212 3 = 2, soit <span class=\"m\">x<\/span> \u2212 3 = \u22122\u2026'],\n    [K.sol[2], '\u2026 donc <span class=\"m\">x<\/span> = 5 ou <span class=\"m\">x<\/span> = 1\\u00a0: deux solutions, une de chaque c\u00f4t\u00e9\\u00a0!'],\n    [K.ineq, 'Et la zone \u00ab\\u00a0\u00e0 2 cases ou moins\\u00a0\u00bb\\u00a0: <span class=\"m\">|x<\/span> \u2212 3<span class=\"m\">|<\/span> \u2264 2, c\u2019est-\u00e0-dire 1 \u2264 <span class=\"m\">x<\/span> \u2264 5.'],\n    [K.wallsCap, 'Dans une grille, on se d\u00e9place seulement horizontalement ou verticalement. Le nom vient de Manhattan, \u00e0 New York\\u00a0: les rues forment une grille, et les taxis ne peuvent pas couper en diagonale.'],\n    [K.zap, 'Le virus <span class=\"cZ\">Zap<\/span> est en (4 ; 3), Bip en (1 ; 1). Combien de pas les s\u00e9parent\\u00a0?'],\n    [K.path1[0], '3 pas horizontalement, puis 2 pas verticalement\u2026'],\n    [K.calc, 'd = |1 \u2212 4| + |1 \u2212 3| = 3 + 2 = 5\\u00a0: on additionne les pas horizontaux et les pas verticaux. C\u2019est la <b>distance de Manhattan<\/b>.'],\n    [K.path2[0], 'Par un autre chemin en escalier\\u00a0? Toujours 5 pas\\u00a0!'],\n    [K.ringQ, 'Quelles cases sont \u00e0 exactement 3 pas de <span class=\"cZ\">Zap<\/span>\\u00a0? <span class=\"m\">|x<\/span> \u2212 4<span class=\"m\">|<\/span> + <span class=\"m\">|y<\/span> \u2212 3<span class=\"m\">|<\/span> = 3.'],\n    [K.losange, 'Elles forment un losange\\u00a0!'],\n    [K.circle, '\u00c0 vol d\u2019oiseau, on aurait un cercle. Dans une grille, le \u00ab\\u00a0cercle\\u00a0\u00bb devient un losange.'],\n    [K.duel, 'Deux virus poursuivent Bip\\u00a0: <span class=\"cZ\">Zap<\/span> en (4 ; 4) et <span class=\"cI\">Zip<\/span> en (1 ; 6). Lequel arrive le premier\\u00a0?'],\n    [K.euclid, '\u00c0 vol d\u2019oiseau, <span class=\"cZ\">Zap<\/span> semble plus proche\\u00a0: 4,24 contre 5.'],\n    [K.manh, 'Mais dans la grille\\u00a0: <span class=\"cZ\">Zap<\/span> doit faire 6 pas, <span class=\"cI\">Zip<\/span> seulement 5.'],\n    [K.race[0], 'Ils partent en m\u00eame temps\u2026'],\n    [K.verdict, '\u2026 <span class=\"cI\">Zip<\/span> arrive le premier\\u00a0! Dans un labyrinthe, on compte les pas en suivant les couloirs, pas \u00e0 vol d\u2019oiseau.'],\n    [K.final, '\u00c0 retenir\\u00a0: <b>distance de Manhattan<\/b> = \u00e9cart horizontal + \u00e9cart vertical, soit <span class=\"m\">d<\/span> = |<span class=\"m\">x<\/span><sub>A<\/sub> \u2212 <span class=\"m\">x<\/span><sub>B<\/sub>| + |<span class=\"m\">y<\/span><sub>A<\/sub> \u2212 <span class=\"m\">y<\/span><sub>B<\/sub>|.']\n  ];\n  const VOICE = [\n    [0.3, \"\"],\n    [K.line, \"Bip le robot se d\u00e9place le long d'un couloir gradu\u00e9.\"],\n    [K.star lineTo(Math.cos(a)*rr, Math.sin(a)*rr); } ctx.closePath(); ctx.fill(); glowOff(); ctx.restore(); }\n  function roundRect(x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r); ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath(); }\n  function text(t, x, y, size, color, align, weight){ ctx.font = (weight || 700) + ' ' + size + 'px Manrope, system-ui, sans-serif'; ctx.fillStyle = color; ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle'; ctx.fillText(t, x, y); }\n\n  // ---------- chemins dans la grille ----------\n  const B0 = [1,1], ZAP = [4,3];\n  const pathL = [[1,1],[2,1],[3,1],[4,1],[4,2],[4,3]], pathS = [[1,1],[1,2],[2,2],[3,2],[3,3],[4,3]];\n  const ringPts = []; for (let x=0;x<=GRID.nx;x++) for (let y=0;y<=GRID.ny;y++){ const d = Math.abs(x-4) + Math.abs(y-3); if (d === 3) ringPts.push([x, y]); }\n  ringPts.sort((p, q) => Math.atan2(p[1]-3, p[0]-4) - Math.atan2(q[1]-3, q[0]-4));\n  const ZAP2 = [4,4], ZIP = [1,6];\n  const raceZ = [[4,4],[3,4],[2,4],[1,4],[1,3],[1,2],[1,1]], raceI = [[1,6],[1,5],[1,4],[1,3],[1,2],[1,1]];\n  const along = (path, k) => { const n = path.length - 1, f = clamp(k)*n, i = Math.min(n-1, Math.floor(f)), r = f - i; return [lerp(path[i][0], path[i+1][0], r), lerp(path[i][1], path[i+1][1], r)]; };\n  function drawPath(G, path, k, color, w){ if (k <= 0) return; const n = path.length - 1, f = clamp(k)*n; ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; glowOn(color, 12);\n    ctx.beginPath(); ctx.moveTo(G.X(path[0][0]), G.Y(path[0][1])); for (let i=1;i<=Math.floor(f);i++) ctx.lineTo(G.X(path[i][0]), G.Y(path[i][1]));\n    const p = along(path, k); ctx.lineTo(G.X(p[0]), G.Y(p[1])); ctx.stroke(); glowOff(); }\n  function stepDots(G, path, k, color){ const n = path.length - 1, f = clamp(k)*n; for (let i=1;i<=Math.floor(f + 1e-6);i++){ const p = path[i];\n    ctx.fillStyle = color; ctx.beginPath(); ctx.arc(G.X(p[0]), G.Y(p[1]), G.s*.13, 0, Math.PI*2); ctx.fill(); text(String(i), G.X(p[0]) + G.s*.22, G.Y(p[1]) - G.s*.22, G.s*.26, color); } }\n\n  // ---------- rendu ----------\n  const titleEl = $('title'), card = $('card'), captxt = $('captxt'), capEl = $('caption');\n  let capIdx = -2;\n  function renderAt(T){\n    ctx.clearRect(0, 0, W, H);\n    titleEl.style.opacity = clamp((T-.2)/.6)*(1 - clamp((T-3.4)/.6));\n    const gridK = ease(clamp((T-K.toGrid[0])/(K.toGrid[1]-K.toGrid[0])));\n    // ===== partie 1 : la ligne =====\n    if (gridK < 1){\n      const L = lineMap(), al = clamp((T-K.line)/1)*(1 - gridK); ctx.globalAlpha = al;\n      const y = L.Y;\n      // zone |x \u2212 3| \u2264 2\n      const kz = clamp((T-K.ineq)/1); if (kz > 0){ ctx.fillStyle = 'rgba(109,255,148,' + (.16*kz) + ')'; ctx.fillRect(L.X(1), y - L.s*.55, (L.X(5) - L.X(1))*ease(kz), L.s*1.1);\n        ctx.strokeStyle = 'rgba(109,255,148,' + (.8*kz) + ')'; ctx.lineWidth = 2; ctx.strokeRect(L.X(1), y - L.s*.55, (L.X(5) - L.X(1))*ease(kz), L.s*1.1); }\n      ctx.strokeStyle = css('--wall'); ctx.lineWidth = 3; glowOn(css('--wall'), 10); ctx.beginPath(); ctx.moveTo(L.X(LINE.min - .3), y); ctx.lineTo(L.X(LINE.max + .3), y); ctx.stroke(); glowOff();\n      for (let v=LINE.min; v<=LINE.max; v++){ ctx.strokeStyle = 'rgba(160,180,255,.7)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(L.X(v), y - L.s*.14); ctx.lineTo(L.X(v), y + L.s*.14); ctx.stroke();\n        text(fr(v), L.X(v), y + L.s*.42, L.s*.3, css('--muted')); }\n      // \u00e9toile\n      const ks = T < K.star ? 0 : back(clamp((T-K.star)/.6)); if (ks > 0) drawStar(L.X(3), y - L.s*.9, L.s*.32*ks, T);\n      // Bip : se d\u00e9place en 6 puis en 1, puis reste en 1 ; marqueurs des solutions\n      let bx = 0; const m1 = ease(clamp((T-K.m1[0])/(K.m1[1]-K.m1[0]))), m2 = ease(clamp((T-K.m2[0])/(K.m2[1]-K.m2[0]))); bx = lerp(0, 6, m1); bx = lerp(bx, 1, m2);\n      const kb = T < K.bip ? 0 : back(clamp((T-K.bip)/.6));\n      if (kb > 0 && T < K.q + .5) dra  + 20px); max-width:min(46%, 30em); pointer-events:none; font-size:calc(var(--u)*2.1); font-weight:700; line-height:1.25; }\n.caption > span{ display:block; }\n.caption .bar{ display:block; width:calc(var(--u)*6); height:calc(var(--u)*.5); border-radius:99px; margin-bottom:calc(var(--u)*1.2); background:linear-gradient(90deg, var(--bip), var(--zip), var(--zap)); }\n.card{ position:absolute; right:calc(var(--u)*3.5); bottom:calc(var(--u)*3.5 + 20px); width:21em; padding:calc(var(--u)*1.8) calc(var(--u)*2.2); font-size:calc(var(--u)*1.7);\n  background:var(--glass); border:1px solid var(--stroke); border-radius:calc(var(--u)*1.8); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }\n.card h3{ margin:0 0 .5em; font-size:.8em; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:800; }\n.sec{ display:grid; gap:.35em; }\n.line{ white-space:nowrap; font-variant-numeric:tabular-nums; }\n.big{ font-size:1.25em; }\n.hr{ height:1px; background:var(--stroke); margin:.6em 0; }\n.num{ display:inline-block; min-width:1.6em; text-align:right; }\ntable.cmp{ border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums; }\ntable.cmp td, table.cmp th{ padding:.25em .3em; text-align:left; white-space:nowrap; }\ntable.cmp th{ font-size:.82em; color:var(--muted); font-weight:700; }\n.ctrl{ position:absolute; right:calc(var(--u)*3.5); top:calc(var(--u)*3); display:flex; gap:8px; }\n.ctrl button{ font:inherit; font-weight:700; font-size:14px; padding:9px 15px; border-radius:99px; border:1px solid var(--stroke); background:var(--glass); color:var(--ink); cursor:pointer; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }\n.ctrl button:focus-visible{ outline:3px solid var(--bip); outline-offset:2px; }\n.seek{ position:absolute; left:0; right:0; bottom:0; padding:28px calc(var(--u)*3.5) calc(var(--u)*1.2) calc(var(--u)*4); display:flex; align-items:center; gap:14px; transition:opacity .25s; }\n.seek input{ flex:1; accent-color:var(--bip); height:22px; cursor:pointer; }\n.seek span{ font-size:14px; font-weight:600; color:var(--muted); font-variant-numeric:tabular-nums; min-width:6.5em; text-align:right; }\n@media (hover: hover){ .seek{ opacity:0; } .seek:hover, .seek:has(input:focus-visible), .seek.drag{ opacity:1; } }\n.rec .ctrl, .rec .seek{ display:none; } .rec *{ transition:none !important; }\n@media (max-aspect-ratio: 1/1){\n  .stage{ --u:min(1.9vw, 1.2vh); }\n  .card{ left:calc(var(--u)*2.5); right:calc(var(--u)*2.5); top:calc(var(--u)*2.5); bottom:auto; width:auto; font-size:calc(var(--u)*1.7); }\n  .ctrl{ left:calc(var(--u)*2.5); right:calc(var(--u)*2.5); top:auto; bottom:calc(var(--u)*2 + 34px); flex-wrap:wrap; gap:6px; }\n  .ctrl button{ padding:7px 11px; font-size:13px; }\n  .caption{ left:calc(var(--u)*2.5); right:calc(var(--u)*2.5); max-width:none; bottom:calc(var(--u)*2 + 90px); font-size:calc(var(--u)*2.6); }\n  .seek{ padding:10px calc(var(--u)*3) calc(var(--u)*2); }\n}\n.cG1{ color:var(--g1); } .cG2{ color:var(--g2); } .cM{ color:var(--mean); }\n.sorted span{ display:inline-block; min-width:1.4em; text-align:center; border-radius:.3em; }\n.sorted span.med{ background:rgba(109,255,148,.2); color:var(--ok); font-weight:800; }\n<\/style>\n<\/head>\n<body>\n<div class=\"stage\" id=\"stage\">\n  <canvas id=\"c\" aria-label=\"Animation : placer un ou deux d\u00e9p\u00f4ts dans une ville en grille pour livrer des clients\"><\/canvas>\n  <div class=\"title\" id=\"title\"><div><h1>O\u00f9 placer le d\u00e9p\u00f4t&nbsp;?<\/h1><p>Application 1 \u00b7 distance de Manhattan<\/p><\/div><\/div>\n  <div class=\"card\" id=\"card\" style=\"opacity:0\">\n    <div class=\"sec\" id=\"secA\">\n      <h3>L\u2019arr\u00eat de bus<\/h3>\n      <div class=\"line\">maisons en 1, 2, 4, 7 et <span id=\"h5\">9<\/span><\/div>\n      <div class=\"line\"><span class=\"m\">f(x)<\/span> = \u03a3 <span class=\"m\">|x<\/span> \u2212 <span class=\"m\">a\u1d62|<\/span> &nbsp;<span class=\"mu\" style=\"font-size:.85em\">(trajet total)<\/span><\/div>\n      <div class=\"line big\" id=\"liveA\">&nbsp;<\/div>\n      <div class=\"hr\"><\/div>\n      <div class=\"line\" id=\"minA\">minimum en <span class=\"m\">x<\/span> = <b class=\"cOk\">4<\/b> = la <b class=\"cOk\">m\u00e9diane<\/b><\/div>\n      <div class=\"line\" id=\"meanA\"><span class=\"cM\">moyenne<\/span> = <span id=\"meanV\">4,6<\/span> &nbsp;\u00b7&nbsp; <span class=\"cOk\">m\u00e9diane<\/span> = 4<\/div>\n    <\/div>\n    <div class=\"sec\" id=\"secB\" style=\"display:none\">\n      <h3>Un d\u00e9p\u00f4t pour 7 clients<\/h3>\n      <div class=\"line sorted\" id=\"xs\">x rang\u00e9s&nbsp;: <span>1<\/span><span>2<\/span><span>3<\/span><span class=\"med\">5<\/span><span>6<\/span><span>7<\/span><span>8<\/span><\/div>\n      <div class=\"line sorted\" id=\"ys\">y rang\u00e9s&nbsp;: <span>1<\/span><span>2<\/span><span>3<\/span><span class=\"med\">4<\/span><span>5<\/span><span>6<\/span><span>6<\/span><\/div>\n      <div class=\"line\" id=\"whB\">d\u00e9p\u00f4t au milieu&nbsp;: <b class=\"cOk\">(5 ; 4)<\/b><\/div>\n      <div class=\"hr\"><\/div>\n      <div id=\"rowsB\" style=\"display:grid; gap:.08em; font-size:.9em; font-variant-numeric:tabular-nums\"><\/div>\n      <div class=\"line\" id=\"sumB\" style=\"margin-top:.25em\">&nbsp;<\/div>\n      <div class=\"line\" id=\"liveB\">&nbsp;<\/div>\n    <\/div>\n    <div class=\"sec\" id=\"secC\" style=\"display:none\">\n      <h3>Deux d\u00e9p\u00f4ts<\/h3>\n      <div class=\"line\" id=\"itC\">&nbsp;<\/div>\n      <div class=\"line\" id=\"stepC\">&nbsp;<\/div>\n      <div class=\"hr\"><\/div>\n      <div class=\"line\"><span class=\"cG1\">\u25cf d\u00e9p\u00f4t 1<\/span>&nbsp; <span id=\"c1\">&nbsp;<\/span><\/div>\n      <div class=\"line\"><span class=\"cG2\">\u25cf d\u00e9p\u00f4t 2<\/span>&nbsp; <span id=\"c2\">&nbsp;<\/span><\/div>\n      <div class=\"line\" id=\"totC\">&nbsp;<\/div>\n    <\/div>\n  <\/div>\n  <div class=\"caption\" id=\"caption\" style=\"opacity:0\"><i class=\"bar\"><\/i><span id=\"captxt\"><\/span><\/div>\n  <div class=\"ctrl\"><button id=\"voice\" aria-pressed=\"false\">Activer la voix<\/button><button id=\"sound\" aria-pressed=\"false\">Activer le son<\/button><button id=\"pause\">Pause<\/button><button id=\"replay\">Rejouer<\/button><\/div>\n  <div class=\"seek\"><input type=\"range\" id=\"seek\" min=\"0\" max=\"72\" step=\"0.1\" value=\"0\" aria-label=\"Position dans l'animation\"><span id=\"clock\">0:00 / 1:12<\/span><\/div>\n<\/div>\n<script>\n(function(){\n  const REC = /[?&]record/.test(location.search); if (REC) document.body.classList.add('rec');\n  const $ = id => document.getElementById(id);\n  const clamp = x => Math.max(0, Math.min(1, x));\n  const ease = x => x<.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2;\n  const lerp = (a,b,k) => a + (b-a)*k;\n  const back = x => { const c=1.7, c3=c+1; return 1 + c3*Math.pow(x-1,3) + c*Math.pow(x-1,2); };\n  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();\n  const fr = n => String(Math.round(n*100)/100).replace('.', ',').replace('-', '\u2212');\n  const med = a => { a = a.slice().sort((x,y) => x-y); const n = a.length; return n%2 ? a[(n-1)/2] : (a[n/2-1] + a[n/2])/2; };\n  const man = (p, c) => Math.abs(p[0]-c[0]) + Math.abs(p[1]-c[1]);\n\n  // ---------- donn\u00e9es ----------\n  const HOUSES = [1, 2, 4, 7, 9];\n  const CLIENTS = [[1,2],[2,6],[3,3],[5,5],[6,1],[7,4],[8,6]], WH = [med(CLIENTS.map(p => p[0])), med(CLIENTS.map(p => p[1]))];   // (5 ; 4)\n  const PTS = [[1,1],[2,1],[1,3],[2,2],[3,2],[2,4],[3,3],[6,5],[7,6],[8,4],[7,4],[8,6],[6,6],[9,5]];\n  // K-m\u00e9dianes : on pr\u00e9calcule les \u00e9tapes\n  const ITER = []; { let C = [[4,6],[5,1]]; for (let it=0; it<3; it++){ const lab = PTS.map(p => man(p, C[0]) <= man(p, C[1]) ? 0 : 1);\n      const N = [0,1].map(k => { const g = PTS.filter((p,i) => lab[i] === k); return [med(g.map(p => p[0])), med(g.map(p => p[1]))]; });\n      ITER.push({C, lab, N, tot: PTS.reduce((s, p, i) => s + man(p, C[lab[i]]), 0)}); C = N; } }\n\n  // ---------- chronologie ----------\n  const K = { road:1e9, formula:1e9, scan:[1e9, 1e9], toMin:[1e9, 1e9], minCap:1e9, out:[1e9, 1e9], mean:1e9, robust:1e9,\n              toCity:[2.4, 4.4], why:4.9, clients:10.5, manh:14.5, mx:21, my:25, wh:29, routes:[31, 46.4], rowDt:2.2, sum:47, test:[50.5, 56],\n              toK:[1e9, 1e9], kIntro:1e9, it0:1e9, itLen:8.5, done:1e9, ml:57, final:63.5 };\n  const itT = i => K.it0 + i*K.itLen;   // affectation \u00e0 itT, d\u00e9placement \u00e0 itT + 4\n  const END = 72;\n  const caps = [\n    [0.3, ''],\n    [K.road, 'Cinq maisons le long d\u2019une route. O\u00f9 placer l\u2019arr\u00eat de bus pour que le trajet total \u00e0 pied soit le plus court\\u00a0?'],\n    [K.formula, 'Trajet total pour un arr\u00eat en <span class=\"m\">x<\/span>\\u00a0: <span class=\"m\">f(x)<\/span> = |<span class=\"m\">x<\/span> \u2212 1| + |<span class=\"m\">x<\/span> \u2212 2| + |<span class=\"m\">x<\/span> \u2212 4| + |<span class=\"m\">x<\/span> \u2212 7| + |<span class=\"m\">x<\/span> \u2212 9|.'],\n    [K.scan[0], 'D\u00e9pla\u00e7ons l\u2019arr\u00eat et tra\u00e7ons <span class=\"m\">f<\/span>\\u00a0: une courbe faite de segments.'],\n    [K.minCap, 'Le minimum est en <span class=\"m\">x<\/span> = 4\\u00a0: la maison du milieu. C\u2019est la <b class=\"cOk\">m\u00e9diane<\/b>\\u00a0!'],\n    [K.out[0], 'Et si la derni\u00e8re maison s\u2019\u00e9loigne beaucoup\\u00a0?'],\n    [K.mean, 'La <span class=\"cM\">moyenne<\/span> se fait tirer vers la maison isol\u00e9e\u2026'],\n    [K.robust, '\u2026 mais la <span class=\"cOk\">m\u00e9diane<\/span> ne bouge pas\\u00a0: le meilleur arr\u00eat reste en <span class=\"m\">x<\/span> = 4.'],\n    [K.toCity[0], 'Une ville en grille, vue du ciel.'],\n    [K.why, '<b>\u00c0 quoi \u00e7a sert\\u00a0?<\/b> Une entreprise de livraison veut construire un d\u00e9p\u00f4t. Plus les trajets sont courts, moins elle d\u00e9pense en carburant et en temps.'],\n    [K.clients, 'Voici ses 7 clients. O\u00f9 placer le d\u00e9p\u00f4t pour que le <b>total<\/b> des trajets soit le plus petit possible\\u00a0?'],\n    [K.manh, 'Les camions suivent les rues\\u00a0: pas de diagonale\\u00a0! On additionne la distance horizontale et la distance verticale. C\u2019est la <b>distance de Manhattan<\/b>.'],\n    [K.mx, 'Astuce\\u00a0: on traite <span class=\"m\">x<\/span> et <span class=\"m\">y<\/span> s\u00e9par\u00e9ment\\u00a0! On range les <span class=\"m\">x<\/span> dans l\u2019ordre\\u00a0: celui du milieu vaut 5\u2026'],\n    [K.my, '\u2026 et le <span class=\"m\">y<\/span> du milieu vaut 4.'],\n    [K.wh, 'Le meilleur d\u00e9p\u00f4t est en (5 ; 4)\\u00a0: au \u00ab\\u00a0milieu\\u00a0\u00bb des clients.'],\n    [K.routes[0], 'Calculons le trajet vers chaque client\\u00a0: |<span class=\"m\">x<\/span> \u2212 5| + |<span class=\"m\">y<\/span> \u2212 4|.'],\n    [K.sum, 'Au total\\u00a0: 26 pas. C\u2019est le plus petit total possible.'],\n    [K.test[0], 'D\u00e9pla\u00e7ons le d\u00e9p\u00f4t ailleurs\\u00a0: le total est toujours plus grand que 26.'],\n    [K.toK[0], 'Et avec deux d\u00e9p\u00f4ts\\u00a0?'],\n    [K.kIntro, 'Et si l\u2019entreprise construit <b>deux<\/b> d\u00e9p\u00f4ts\\u00a0? O\u00f9 les placer, et quels clients chacun doit-il livrer\\u00a0? On part de deux positions au hasard, puis on am\u00e9liore \u00e9tape par \u00e9tape.'],\n    [itT(0), '<b>\u00c9tape 1<\/b>\\u00a0: chaque client choisit le d\u00e9p\u00f4t le plus proche, en suivant les rues.'],\n    [itT(0) + 4, '<b>\u00c9tape 2<\/b>\\u00a0: chaque d\u00e9p\u00f4t se d\u00e9place au \u00ab\\u00a0milieu\\u00a0\u00bb de ses clients.'],\n    [itT(1), 'On recommence\\u00a0: chaque client choisit \u00e0 nouveau\u2026'],\n    [itT(1) + 4, '\u2026 et les d\u00e9p\u00f4ts se d\u00e9placent encore.'],\n    [itT(2), 'Encore une fois\u2026'],\n    [K.done, 'Plus rien ne bouge\\u00a0: on a trouv\u00e9 les deux zones de livraison. La fronti\u00e8re suit les ru n  .ctrl button{ padding:7px 11px; font-size:13px; }\n  .caption{ left:calc(var(--u)*2.5); right:calc(var(--u)*2.5); max-width:none; bottom:calc(var(--u)*2 + 90px); font-size:calc(var(--u)*2.6); }\n  .seek{ padding:10px calc(var(--u)*3) calc(var(--u)*2); }\n}\n.cBl{ color:var(--blue); } .pill{ display:inline-block; padding:.05em .55em; border-radius:99px; font-weight:800; font-size:.92em; }\n.pill.patrol{ background:rgba(160,180,255,.15); color:#c9d2ff; } .pill.chase{ background:rgba(255,79,109,.25); color:#ff6b80; } .pill.lost{ background:rgba(255,210,63,.18); color:#ffd23f; }\n<\/style>\n<\/head>\n<body>\n<div class=\"stage\" id=\"stage\">\n  <canvas id=\"c\" aria-label=\"Animation : Bip ramasse des \u00e9toiles dans un labyrinthe ; un virus bleu bouge au hasard, un virus rouge fonce sur Bip quand sa distance de Manhattan est inf\u00e9rieure \u00e0 5\"><\/canvas>\n  <div class=\"title\" id=\"title\"><div><h1>Bip et les virus<\/h1><p>Application 2 \u00b7 distance de Manhattan<\/p><\/div><\/div>\n  <div class=\"card\" id=\"card\" style=\"opacity:0\">\n    <h3>Virus bleu<\/h3>\n    <div class=\"line\" id=\"blueL\">se d\u00e9place <b class=\"cBl\">au hasard<\/b><\/div>\n    <div class=\"hr\"><\/div>\n    <h3>Virus rouge<\/h3>\n    <div class=\"line\" id=\"redF\"><span class=\"m\">d<\/span> = |<span class=\"m\">x<\/span><sub>R<\/sub> \u2212 <span class=\"m\">x<\/span><sub>B<\/sub>| + |<span class=\"m\">y<\/span><sub>R<\/sub> \u2212 <span class=\"m\">y<\/span><sub>B<\/sub>|<\/div>\n    <div class=\"line big\" id=\"redD\">&nbsp;<\/div>\n    <div class=\"line\" id=\"redP\">&nbsp;<\/div>\n    <div class=\"line\" id=\"redS\">&nbsp;<\/div>\n    <div class=\"line mu\" style=\"font-size:.9em; white-space:normal\">r\u00e8gle&nbsp;: si <span class=\"m\">d<\/span> &lt; 5 \u2192 il fonce vers Bip par les couloirs<\/div>\n    <div class=\"hr\"><\/div>\n    <div class=\"line\" id=\"stars\">&nbsp;<\/div>\n  <\/div>\n  <div class=\"caption\" id=\"caption\" style=\"opacity:0\"><i class=\"bar\"><\/i><span id=\"captxt\"><\/span><\/div>\n  <div class=\"ctrl\"><button id=\"voice\" aria-pressed=\"false\">Activer la voix<\/button><button id=\"sound\" aria-pressed=\"false\">Activer le son<\/button><button id=\"pause\">Pause<\/button><button id=\"replay\">Rejouer<\/button><\/div>\n  <div class=\"seek\"><input type=\"range\" id=\"seek\" min=\"0\" max=\"60\" step=\"0.1\" value=\"0\" aria-label=\"Position dans l'animation\"><span id=\"clock\">0:00 / 1:00<\/span><\/div>\n<\/div>\n<script>\n(function(){\n  const REC = /[?&]record/.test(location.search); if (REC) document.body.classList.add('rec');\n  const $ = id => document.getElementById(id);\n  const clamp = x => Math.max(0, Math.min(1, x));\n  const ease = x => x<.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2;\n  const lerp = (a,b,k) => a + (b-a)*k;\n  const back = x => { const c=1.7, c3=c+1; return 1 + c3*Math.pow(x-1,3) + c*Math.pow(x-1,2); };\n  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();\n\n  // ---------- labyrinthe ----------\n  const MAP = [\"###############\",\"#.....#.......#\",\"#.###.#.#####.#\",\"#.#.......#...#\",\"#.#.###.#.#.###\",\".....###.......\",\"#.###.#.#.###.#\",\"#...#.....#...#\",\"###.#.###.#.#.#\",\"#.......#.....#\",\"###############\"].reverse();\n  const NX = 14, NY = 10;\n  const isOpen = (x, y) => y >= 0 && y <= NY && x >= 0 && x <= NX && MAP[y][x] === '.';\n  const nbrs = (x, y) => { const r = []; [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx, dy]) => { const nx = x + dx, ny = y + dy; if (isOpen(nx, ny)) r.push([nx, ny]); }); return r; };\n  const eq = (a, b) => a[0] === b[0] && a[1] === b[1], man = (a, b) => Math.abs(a[0]-b[0]) + Math.abs(a[1]-b[1]);\n  function bfs(a, b){ const k = p => p[0] + ',' + p[1], prev = {}; const q = [a]; prev[k(a)] = null; while (q.length){ const c = q.shift(); if (eq(c, b)) break; for (const n of nbrs(...c)) if (!(k(n) in prev)){ prev[k(n)] = c; q.push(n); } }\n    if (!(k(b) in prev)) return [a]; const path = []; let c = b; while (c){ path.unshift(c); c = prev[k(c)]; } return path; }\n\n  // ---------- simulation (d\u00e9terministe) ----------\n  const LOOP = [[7,9],[8,9],[9,9],[10,9],[11,9],[12,9],[13,9],[13,8],[13,7],[12,7],[11,7],[11,6],[11,5],[10,5],[9,5],[9,6],[9,7],[8,7],[7,7],[7,8]];\n  const BIPWP = [[7,1],[5,3],[9,3],[9,1],[13,1],[13,3],[13,5],[14,5],'TP',[1,4],[1,3],[3,3],[3,1],[1,1]];\n  const SIM = (() => { let seed = 7; const rnd = () => { seed = (seed*16807) % 2147483647; return seed/2147483647; };\n    const blueZone = p => p[0] <= 5 && p[1] >= 6;\n    let bip = [3,1], red = LOOP[8], blue = [3,9], li = 8, mode = 'patrol', wpi = 0, tp = false; const log = [];\n    for (let t=0;t<80;t++){\n      const d = man(red, bip); if (d < 5) mode = 'chase'; else if (mode === 'chase') mode = 'return';\n      let nred = red;\n      if (mode === 'chase'){ const p = bfs(red, bip); if (p.length > 1) nred = p[1]; }\n      else if (mode === 'return'){ let best = null, bl = 1e9, bi = 0; LOOP.forEach((c, i) => { const p = bfs(red, c); if (p.length < bl){ bl = p.length; best = p; bi = i; } }); if (bl <= 1){ mode = 'patrol'; li = (bi + 1) % LOOP.length; nred = LOOP[li]; } else nred = best[1]; }\n      else { li = (li + 1) % LOOP.length; nred = LOOP[li]; }\n      let nbip = bip; tp = false; if (wpi < BIPWP.length){ const wp = BIPWP[wpi]; if (wp === 'TP'){ nbip = [0,5]; tp = true; wpi++; } else { const p = bfs(bip, wp); nbip = p.length > 1 ? p[1] : bip; if (eq(nbip, wp)) wpi++; } }\n      const ns = nbrs(...blue).filter(blueZone), nblue = ns[Math.floor(rnd()*ns.length)];\n      log.push({bip, red, blue, mode, d, nbip, nred, nblue, tp, bdir:[nblue[0]-blue[0], nblue[1]-blue[1]]});\n      bip = nbip; red = nred; blue = nblue; if (wpi >= BIPWP.length) break; }\n    log.push({bip, red, blue, mode: man(red, bip) < 5 ? 'chase' : mode, d: man(red, bip), nbip: bip, nred: red, nblue: blue, tp:false, bdir:[0,0]});\n    return log; })();\n  const STARS = []; { const seen = new Set(); SIM.forEach((e, i) => { const k = e.bip.join(','); if (i > 0 && i % 2 === 1 && !seen.has(k) && !(e.bip[0] === 0 && e.bip[1] === 5)) { STARS.push({p:e.bip, i}); } seen.add(k); });\n    const last = SIM[SIM.length-1].bip; if (!STARS.some(s => eq(s.p, last))) STARS.push({p:last, i:SIM.length-1}); }\n\n  // ---------- chronologie ----------\n  const TICK = .75, T0 = 21;\n  const PATHLEN = i => bfs(SIM[i].red, SIM[i].bip).length - 1;\n  const iDetect = SIM.findIndex(e => e.mode === 'chase'), iLost = SIM.findIndex((e, i) => i > iDetect && e.mode !== 'chase'), iEnd = SIM.length - 1;\n  const K = { maze:4.2, blue:8, red:12.5, zone:17, go:T0, detect:T0 + iDetect*TICK, estim:T0 + (iDetect + 2.5)*TICK, flee:T0 + (iDetect + 6)*TICK, lost:T0 + iLost*TICK, blueAgain:T0 + (iLost + 3)*TICK, end:T0 + iEnd*TICK, final:T0 + iEnd*TICK + 3.5 };\n  const END = Math.ceil(K.final + 8);\n  const caps = [\n    [0.3, ''],\n    [K.maze, 'Bip doit ramasser toutes les \u00e9toiles du labyrinthe en \u00e9vitant les deux virus.'],\n    [K.blue, 'Le virus <span class=\"cBl\">bleu<\/span> est programm\u00e9 pour bouger <b>au hasard<\/b>\\u00a0: \u00e0 chaque case, il tire une direction au sort.'],\n    [K.red, 'Le virus <span class=\"cZ\">rouge<\/span> patrouille. Il calcule sans arr\u00eat sa distance de Manhattan jusqu\u2019\u00e0 Bip\\u00a0: <span class=\"m\">d<\/span> = |<span class=\"m\">x<\/span><sub>R<\/sub> \u2212 <span class=\"m\">x<\/span><sub>B<\/sub>| + |<span class=\"m\">y<\/span><sub>R<\/sub> \u2212 <span class=\"m\">y<\/span><sub>B<\/sub>|.'],\n    [K.zone, 'Sa r\u00e8gle\\u00a0: d\u00e8s que <span class=\"m\">d<\/span> &lt; 5, il fonce vers Bip. Sa zone de d\u00e9tection (en rouge) forme un losange.'],\n    [K.go, 'C\u2019est parti\\u00a0! Regardez <span class=\"m\">d<\/span> changer \u00e0 chaque pas\u2026'],\n    [K.detect, '<span class=\"m\">d<\/span> = ' + SIM[iDetect].d + ' &lt; 5\\u00a0: alerte\\u00a0! Mais par les couloirs, le vrai chemin (en orange) fait ' + PATHLEN(iDetect) + ' cases.'],\n    [K.estim, 'La distance de Manhattan est toujours plus petite ou \u00e9gale au vrai chemin\\u00a0: c\u2019est une <b>estimation rapide<\/b>, tr\u00e8s facile \u00e0 calculer.'],\n    [K.flee, 'Bip file vers le tunnel, le virus rouge sur les talons\u2026'],\n    [K.lost, 'Bip ressort de l\u2019autre c\u00f4t\u00e9\\u00a0: <span class=\"m\">d<\/span> = ' + SIM[iLost].d + ' \u2265 5. Le virus rouge perd sa trace et reprend sa patrouille.'],\n    [K.blueAgain, 'Le virus bleu, lui, continue au hasard\\u00a0: il ne cherche pas Bip.'],\n    [K.end, 'Toutes les \u00e9toiles sont ramass\u00e9es\\u00a0: niveau termin\u00e9\\u00a0!'],\n    [K.final, 'Une valeur absolue et une comparaison (<span class=\"m\">d<\/span> &lt; 5) suffisent \u00e0 programmer le comportement d\u2019un ennemi\\u00a0!']\n  ];\n  const VOICE = [\n    [0.3, \"Bip et les virus.\"],\n    [K.maze, \"Bip doit ramasser toutes les \u00e9toiles du labyrinthe, en \u00e9vitant les deux virus.\"],\n    [K.blue, \"Le virus bleu est programm\u00e9 pour bouger au hasard : \u00e0 chaque case, il tire une direction au sort.\"],\n    [K.red, \"Le virus rouge patrouille. Il calcule sans arr\u00eat sa distance de Manhattan jusqu'\u00e0 Bip.\"],\n    [K.zone, \"Sa r\u00e8gle : d\u00e8s que la distance est inf\u00e9rieure \u00e0 cinq, il fonce vers Bip. Sa zone de d\u00e9tection forme un losange.\"],\n    [K.go, \"C'est parti ! Regardez la distance changer \u00e0 chaque pas\u2026\"],\n    [K.detect, \"La distance est inf\u00e9rieure \u00e0 cinq : alerte ! Mais par les couloirs, le vrai chemin, en orange, est plus long.\"],\n    [K.estim, \"La distance de Manhattan est toujours plus petite ou \u00e9gale au vrai chemin : c'est une estimation rapide, tr\u00e8s facile \u00e0 calculer.\"],\n    [K.flee, \"Bip file vers le tunnel, le virus rouge sur les talons\u2026\"],\n    [K.lost, \"Bip ressort de l'autre c\u00f4t\u00e9 : la distance d\u00e9passe cinq. Le virus rouge perd sa trace, et reprend sa patrouille.\"],\n    [K.bl
