ion\"><span id=\"clock\">0:00 / 1:26<\/span><\/div>\n<\/div>\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js\"><\/script>\n<script src=\"https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js\"><\/script>\n<script src=\"https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/objects/Sky.js\"><\/script>\n<script src=\"https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/objects/Water.js\"><\/script>\n<script>\n(function(){\n  const REC = /[?&]record/.test(location.search); if (REC) document.body.classList.add('rec');\n  const $ = id => document.getElementById(id);\n  const clamp = x => Math.max(0, Math.min(1, x));\n  const ease = x => x<.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2;\n  const sine = x => -(Math.cos(Math.PI*x)-1)/2;\n  const lerp = (a,b,k) => a + (b-a)*k;\n  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;\n  const rnd = (() => { let x = 20260; return () => ((x = (x*16807) % 2147483647) / 2147483647); })();\n  // format d'un pourcentage avec 2 chiffres significatifs\n  function pctTxt(f){ const p = f*100; if (p >= 99.95) return '100 %'; if (p >= 10) return p.toFixed(1).replace('.', ',') + ' %'; const d = Math.max(1, Math.min(7, 1 - Math.floor(Math.log10(p)))); return p.toFixed(d).replace('.', ',') + ' %'; }\n\n  // ---------- chronologie : un jour = une \u00e9tape, le compteur et la surface changent ensemble ----------\n  const SAY = [10, 20, 25];                                                                                   // jours comment\u00e9s : on s'y arr\u00eate un peu\n  const DS = [0, 9, 14]; for (let n=3;n<=30;n++) DS.push(DS[n-1] + (SAY.includes(n - 1) ? 3.2 : n <= 20 ? .8 : n <= 26 ? 1.3 : 2.6));   // DS[n] = d\u00e9but du jour n\n  const TR = n => Math.min(.6, .6*(DS[n] - DS[n-1]));                                                         // dur\u00e9e de la pouss\u00e9e au d\u00e9but du jour n\n  const K = { scene:4.2, d1:DS[1], d30:DS[30], q:DS[30] + 3.2, q15:DS[ :calc(var(--u)*3.5); top:calc(var(--u)*3); display:flex; gap:8px; }\n.ctrl button{ font:inherit; font-weight:700; font-size:14px; padding:9px 15px; border-radius:99px; border:1px solid var(--stroke); background:var(--glass); color:var(--ink); cursor:pointer; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }\n.ctrl button:focus-visible{ outline:3px solid var(--bip); outline-offset:2px; }\n.seek{ position:absolute; left:0; right:0; bottom:0; padding:28px calc(var(--u)*3.5) calc(var(--u)*1.2) calc(var(--u)*4); display:flex; align-items:center; gap:14px; transition:opacity .25s; }\n.seek input{ flex:1; accent-color:var(--bip); height:22px; cursor:pointer; }\n.seek span{ font-size:14px; font-weight:600; color:var(--muted); font-variant-numeric:tabular-nums; min-width:6.5em; text-align:right; }\n@media (hover: hover){ .seek{ opacity:0; } .seek:hover, .seek:has(input:focus-visible), .seek.drag{ opacity:1; } }\n.rec .ctrl, .rec .seek{ display:none; } .rec *{ transition:none !important; }\n@media (max-aspect-ratio: 1/1){\n  .stage{ --u:min(1.9vw, 1.2vh); }\n  .card{ left:calc(var(--u)*2.5); right:calc(var(--u)*2.5); top:calc(var(--u)*2.5); bottom:auto; width:auto; font-size:calc(var(--u)*1.7); }\n  .ctrl{ left:calc(var(--u)*2.5); right:calc(var(--u)*2.5); top:auto; bottom:calc(var(--u)*2 + 34px); flex-wrap:wrap; gap:6px; }\n  .ctrl button{ padding:7px 11px; font-size:13px; }\n  .caption{ left:calc(var(--u)*2.5); right:calc(var(--u)*2.5); max-width:none; bottom:calc(var(--u)*2 + 90px); font-size:calc(var(--u)*2.6); }\n  .seek{ padding:10px calc(var(--u)*3) calc(var(--u)*2); }\n}\n.cCaf{ color:var(--caf); } .cT{ color:var(--t); }\n.big2{ font-size:1.5em; font-weight:800; }\n<\/style>\n<\/head>\n<body>\n<div class=\"stage\" id=\"stage\">\n  <canvas id=\"c\" aria-label=\"Animation : la quantit\u00e9 de caf\u00e9ine dans le corps est divis\u00e9e par deux toutes les 5 heures ; d\u00e9croissance exponentielle\"><\/canvas>\n  <div class=\"title\" id=\"title\"><div><h1>La caf\u00e9ine dans le corps<\/h1><p>3 \u00b7 Une exponentielle qui d\u00e9cro\u00eet<\/p><\/div><\/div>\n  <div class=\"card\" id=\"card\" style=\"opacity:0\">\n    <div class=\"sec\" id=\"secA\">\n      <h3>Boisson \u00e9nergisante bue \u00e0 16 h<\/h3>\n      <div class=\"line big2\"><span id=\"clk\">16:00<\/span><\/div>\n      <div class=\"line\">temps \u00e9coul\u00e9&nbsp;: <span class=\"m\">t<\/span> = <b class=\"cT\" id=\"tt\">0 h<\/b><\/div>\n      <div class=\"line\">caf\u00e9ine&nbsp;: <b class=\"cCaf\" id=\"cc\">0 mg<\/b><\/div>\n      <div class=\"hr\"><\/div>\n      <div class=\"line\" id=\"hl\">toutes les 5 h&nbsp;: <b>\u00f7 2<\/b> <span class=\"mu\">(la demi-vie)<\/span><\/div>\n      <div class=\"line big\" id=\"form\" style=\"margin-top:.2em\"><span class=\"m\">C<\/span> = 160 \u00b7 (1/2)<sup><span class=\"m\">t<\/span>/5<\/sup><\/div>\n    <\/div>\n    <div class=\"sec\" id=\"secB\" style=\"display:none\">\n      <h3>\u00c0 23 h, au moment de dormir<\/h3>\n      <div class=\"line\" id=\"b0\">temps \u00e9coul\u00e9&nbsp;: <span class=\"m\">t<\/span> = 23 \u2212 16 = <b class=\"cT\">7 h<\/b><\/div>\n      <div class=\"line big\" id=\"b1\"><span class=\"m\">C<\/span> = 160 \u00b7 (1/2)<sup>7/5<\/sup><\/div>\n      <div class=\"line big\" id=\"b2\">\u2248 <b class=\"cCaf\">61 mg<\/b><\/div>\n    <\/div>\n    <div class=\"sec\" id=\"secC\" style=\"display:none\">\n      <h3>Quand passe-t-on sous 20 mg&nbsp;?<\/h3>\n      <div class=\"line big\" id=\"c0\">160 \u00b7 (1/2)<sup><span class=\"m\">t<\/span>/5<\/sup> = 20<\/div>\n      <div class=\"line big\" id=\"c1\">\u21d4 (1/2)<sup><span class=\"m\">t<\/span>/5<\/sup> = 0,125<\/div>\n      <div class=\"line big\" id=\"c2\">\u21d4 <span class=\"m\">t<\/span>/5 = log<sub>1/2<\/sub>(0,125)<\/div>\n      <div class=\"line big\" id=\"c3\">\u21d4 <span class=\"m\">t<\/span>/5 = 3<\/div>\n      <div class=\"line big\" id=\"c4\">\u21d4 <span class=\"m\">t<\/span> = <b class=\"cT\">15 h<\/b><\/div>\n      <div class=\"hr\"><\/div>\n      <div class=\"line\" id=\"c5\">16 h + 15 h = <b class=\"cOk\">7 h du matin<\/b><\/div>\n    <\/div>\n  <\/div>\n  <div class=\"caption\" id=\"caption\" style=\"opacity:0\"><i class=\"bar\"><\/i><span id=\"captxt\"><\/span><\/div>\n  <div class=\"ctrl\"><button id=\"voice\" aria-pressed=\"false\">Activer la voix<\/button><button id=\"sound\" aria-pressed=\"false\">Activer le son<\/button><button id=\"pause\">Pause<\/button><button id=\"replay\">Rejouer<\/button><\/div>\n  <div class=\"seek\"><input type=\"range\" id=\"seek\" min=\"0\" max=\"71\" step=\"0.1\" value=\"0\" aria-label=\"Position dans l'animation\"><span id=\"clock\">0:00 / 1:11<\/span><\/div>\n<\/div>\n<script>\n(function(){\n  const REC = /[?&]record/.test(location.search); if (REC) document.body.classList.add('rec');\n  const $ = id => document.getElementById(id);\n  const clamp = x => Math.max(0, Math.min(1, x));\n  const ease = x => x<.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2;\n  const lerp = (a,b,k) => a + (b-a)*k;\n  const back = x => { const c=1.7, c3=c+1; return 1 + c3*Math.pow(x-1,3) + c*Math.pow(x-1,2); };\n  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();\n  const fr = n => String(n).replace('.', ',');\n  const Cof = t => 160*Math.pow(.5, t/5);\n  const hhmm = t => { const m = Math.round((16 + t)*60) % 1440; return String(Math.floor(m/60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };\n\n  // ---------- chronologie ----------\n  const K = { can:4.2, drink:[9.5, 12], half:13.5, run:[[18, 22, 5], [23, 27, 10], [28, 32, 15]], formula:33.5, q23:[37.5, 40.5, 43.5], q20:[1e9, 1e9, 1e9, 1e9, 1e9, 1e9], morning:[49, 52], final:57.5 };\n  const END = 71;\n  function tAt(T){ if (T < K.run[0][0]) return 0; let t = 0; for (const [a, b, tt] of K.run){ if (T >= a) t = lerp(t, tt, ease(clamp((T - a)/(b - a)))); } return t; }\n  const caps = [\n    [0.3, ''],\n    [K.can, 'Il est 16 h. Tu bois une canette de boisson \u00e9nergisante (500 ml)\\u00a0: environ <b>160 mg<\/b> de caf\u00e9ine.'],\n    [K.drink[0], 'La caf\u00e9ine passe dans le sang\u2026'],\n    [K.half, 'Puis le corps l\u2019\u00e9limine petit \u00e0 petit\\u00a0: toutes les 5 heures environ, la quantit\u00e9 est divis\u00e9e par 2. C\u2019est la <b>demi-vie<\/b>.'],\n    [K.run[0][1] - .3, '21 h, 5 heures plus tard\\u00a0: 160 \u00f7 2 = 80 mg.'],\n    [K.run[1][1] - .3, '2 h du matin\\u00a0: 80 \u00f7 2 = 40 mg.'],\n    [K.run[2][1] - .3, '7 h du matin\\u00a0: 40 \u00f7 2 = 20 mg.'],\n    [K.formula, 'Apr\u00e8s <span class=\"m\">t<\/span> heures\\u00a0: <span class=\"m\">C<\/span> = 160 \u00b7 (1/2)<sup><span class=\"m\">t<\/span>/5<\/sup>. Une exponentielle qui d\u00e9cro\u00eet.'],\n    [K.q23[0], '\u00c0 23 h, au moment de dormir, combien en reste-t-il\\u00a0? Le temps \u00e9coul\u00e9\\u00a0: <span class=\"m\">t<\/span> = 23 \u2212 16 = 7 heures.'],\n    [K.q23[1], 'On remplace <span class=\"m\">t<\/span> par 7 dans la formule\\u00a0: <span class=\"m\">C<\/span> = 160 \u00b7 (1/2)<sup>7/5<\/sup>.'],\n    [K.q23[2], '\u00c0 la calculatrice\\u00a0: <span class=\"m\">C<\/span> \u2248 61 mg. \u00c0 peu pr\u00e8s autant qu\u2019un expresso\\u00a0! Pas \u00e9tonnant qu\u2019on dorme mal.'],\n    [K.q20[0], 'Et quand passe-t-on sous 20 mg\\u00a0? On r\u00e9sout 160 \u00b7 (1/2)<sup><span class=\"m\">t<\/span>/5<\/sup> = 20.'],\n    [K.q20[1], 'On divise les deux c\u00f4t\u00e9s par 160\\u00a0: (1/2)<sup><span class=\"m\">t<\/span>/5<\/sup> = 20/160 = 0,125.'],\n    [K.q20[2], 'L\u2019inconnue est dans l\u2019exposant\\u00a0: on prend le logarithme en base 1/2. <span class=\"m\">t<\/span>/5 = log<sub>1/2<\/sub>(0,125).'],\n    [K.q20[3], '\u00c0 la calculatrice\\u00a0: log<sub>1/2<\/sub>(0,125) = 3. Donc <span class=\"m\">t<\/span>/5 = 3.'],\n    [K.q20[4], 'On multiplie par 5\\u00a0: <span class=\"m\">t<\/span> = 15 heures.'],\n    [K.q20[5], '16 h + 15 h\\u00a0: on passe sous 20 mg seulement \u00e0 7 h du matin\\u00a0!'],\n
